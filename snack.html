<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>QR Code com Nome e Link</title>
  <style>
    .qrcode-container {
      text-align: center; /* centraliza tudo */
      margin-top: 50px;
    }
    .qrcode-container p {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="qrcode-container">
    <!-- Nome que aparece na tela -->
    <p>Calculadora snack expo</p>
    
    <!-- QR Code com link -->
    <a href="https://snack.expo.dev/?platform=android" target="_blank">
      <img src="../html/snack expo.png.png" alt="QR Code" width="200" height="200">
    </a>
  </div>
  <div class="qrcode-container">
    <!-- Nome que aparece na tela -->
    <p>Troca tela snack expo</p>
    
    <!-- QR Code com link -->
    <a href="https://snack.expo.dev/@miguel1309/d808d1?platform=ios" target="_blank">
      <img src="../html/qr.png.png" alt="QR Code" width="200" height="200">
    </a>
  </div>
</body>
</html>
